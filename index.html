    colors: ['bg','surface','surface2','ink','muted','line','crimson','amber','emerald'].reduce(function(o,k){o[k]='rgb(var(--'+k+') / <alpha-value>)';return o},{})

<style>
/* Mesa de cartas: azul abisal + tinta hueso. Semántica: crimson crítico, amber intermedio, emerald oportunidad. */
:root{--bg:10 18 26;--surface:17 28 39;--surface2:25 40 55;--ink:232 228 216;--muted:145 163 180;--line:145 163 180;--crimson:242 100 90;--amber:233 169 64;--emerald:72 192 146;
  --out:cubic-bezier(.23,1,.32,1);color-scheme:dark}
:root[data-theme=light]{--bg:238 241 243;--surface:252 253 253;--surface2:228 234 238;--ink:14 26 36;--muted:76 94 110;--line:14 26 36;--crimson:176 36 28;--amber:134 86 0;--emerald:10 104 74;color-scheme:light}

body{background:rgb(var(--bg));color:rgb(var(--ink));font-family:'Instrument Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgb(var(--line)/.05) 1px,transparent 1px),linear-gradient(90deg,rgb(var(--line)/.05) 1px,transparent 1px);background-size:56px 56px;background-attachment:fixed}
h1,h2,h3{text-wrap:balance}
.serif{font-family:Newsreader,Georgia,serif;font-optical-sizing:auto}
.prose-w{max-width:68ch}

/* Estructura */
.panel{background:rgb(var(--surface));border:1px solid rgb(var(--line)/.22);border-radius:6px}
.glass{background:rgb(var(--surface)/.74);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
[data-lvl]{--glow:var(--muted)}[data-lvl=crit]{--glow:var(--crimson)}[data-lvl=warn]{--glow:var(--amber)}[data-lvl=ok]{--glow:var(--emerald)}
.sev{border-left:3px solid rgb(var(--glow))}
.sev-t{border-top:2px solid rgb(var(--glow))}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;flex-shrink:0}
.dot-live{position:relative;isolation:isolate}
.dot-live::after{content:"";position:absolute;inset:0;border-radius:inherit;background:inherit;z-index:-1}
.seg{height:6px;border-radius:2px;background:rgb(var(--line)/.2);transform-origin:left}
.seg.on{background:rgb(var(--glow))}
.navbtn{color:rgb(var(--muted))}
.navbtn[aria-selected=true]{color:rgb(var(--ink));background:rgb(var(--surface2)/.7);box-shadow:inset 0 -2px 0 rgb(var(--amber))}
@media (min-width:1024px){.navbtn[aria-selected=true]{box-shadow:inset 2px 0 0 rgb(var(--amber))}}
.radar{background:
  linear-gradient(rgb(var(--line)/.14) 1px,transparent 1px) 0 0/25% 25%,
  linear-gradient(90deg,rgb(var(--line)/.14) 1px,transparent 1px) 0 0/25% 25%}
.radar::before{content:"";position:absolute;right:0;top:0;width:50%;height:50%;background:linear-gradient(225deg,rgb(var(--crimson)/.22),transparent 80%)}
.drawer{transform:translateX(100%);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.scrim{opacity:0;pointer-events:none}.scrim.on{opacity:1;pointer-events:auto}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgb(var(--muted)/.35);border-radius:4px}
:focus-visible{outline:2px solid rgb(var(--amber));outline-offset:2px}
.ticker{overflow-x:auto;scrollbar-width:none}

/* Markdown del semanal (Tailwind no trae estilos tipográficos) */
.md h1{font:600 1.875rem/1.1 Newsreader,Georgia,serif;margin-bottom:1rem}
.md h2{font:500 1.5rem/1.2 Newsreader,Georgia,serif;margin:2rem 0 .75rem;padding-top:1rem;border-top:1px solid rgb(var(--line)/.25)}
.md h3{font-weight:600;margin:1.25rem 0 .25rem}
.md p,.md li{line-height:1.65;margin:.5rem 0}.md ul{list-style:disc;padding-left:1.25rem}.md ol{list-style:decimal;padding-left:1.25rem}
.md a{text-decoration:underline}.md em{color:rgb(var(--muted))}.md blockquote{border-left:3px solid rgb(var(--line)/.4);padding-left:1rem;color:rgb(var(--muted))}
.md table{width:100%;font-size:.875rem;border-collapse:collapse}.md th,.md td{text-align:left;padding:.5rem .75rem;border-bottom:1px solid rgb(var(--line)/.2)}

/* Inicio = pantalla limpia: sin raíl ni buscador, sólo la portada y sus botones */
body[data-mode=inicio] #rail,body[data-mode=inicio] #searchWrap{display:none}
body[data-mode=inicio] #shell{display:block}

/* ANALEMA: logo (ax-). Splash siempre oscuro; en el resto, isotipo compacto estático */
.ax-logo{display:block;width:min(80vw,640px);height:auto;--ax-cyan:#22D3EE;--ax-gold:#D4AF37;--ax-ink:#E6EDF7;--ax-mute:#64748B}
.ax-ring-outer{fill:none;stroke:#22D3EE;stroke-opacity:.55;stroke-width:1.2}
.ax-ticks{fill:none;stroke:#22D3EE;stroke-opacity:.5;stroke-width:5;stroke-dasharray:1.2 38.9;transform-box:fill-box;transform-origin:center}
.ax-globe-rim{fill:none;stroke:#22D3EE;stroke-width:1.4}
.ax-par{fill:none;stroke:#3B82F6;stroke-opacity:.45;stroke-width:.8}
.ax-eq{stroke:#22D3EE;stroke-opacity:.7}
.ax-mer{fill:none;stroke:#3B82F6;stroke-opacity:.5;stroke-width:.8;transform-box:fill-box;transform-origin:center}
.ax-sweep{opacity:.9}
.ax-sweep-line{stroke:#22D3EE;stroke-opacity:.5;stroke-width:1}
.ax-analemma-base{fill:none;stroke:#D4AF37;stroke-opacity:.35;stroke-width:1.6}
.ax-analemma-flow{fill:none;stroke:#D4AF37;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:26 174}
.ax-mark{fill:#0B0F19;stroke:#D4AF37;stroke-width:1.2}
.ax-sun-core{fill:#F5D77A}.ax-sun-halo{fill:#D4AF37;fill-opacity:.35}
.ax-word{font:700 50px/1 Inter,system-ui,sans-serif;fill:#E6EDF7}
.ax-tag{font:500 10px/1 Inter,system-ui,sans-serif;fill:#64748B}
.ax-live{font:600 9px/1 Inter,system-ui,sans-serif;fill:#22D3EE}
.ax-live-dot{fill:#22D3EE}.ax-rule{stroke:#D4AF37;stroke-width:1.5}
@supports (offset-path:path("M0 0")){.ax-sun{offset-path:path("M0 0 C18 -14 20 -44 0 -48 C-20 -44 -18 -14 0 0 C22 14 26 48 0 52 C-26 48 -22 14 0 0 Z");offset-rotate:0deg}}
.ax-brand{display:inline-flex;align-items:center;gap:.65rem;text-decoration:none;color:inherit}
.ax-iso{width:40px;height:40px;flex:none;border-radius:10px;background:#0B0F19;border:1px solid rgb(var(--line)/.35)}
.ax-name{font:700 1.45rem/1 Inter,system-ui,sans-serif;letter-spacing:.14em}
.ax-sub{display:block}
@media (max-width:640px){.ax-sub{display:none}}
#splash{background:#0B0F19;color:#E6EDF7}
#splash p{color:#64748B}
@media (prefers-reduced-motion:no-preference){
  #splash .ax-logo{animation:ax-in .9s var(--out) both}
  @keyframes ax-in{from{opacity:0;transform:scale(.94)}}
  @keyframes ax-spin{to{transform:rotate(-360deg)}}
  @keyframes ax-trace{to{stroke-dashoffset:-200}}
  @keyframes ax-travel{to{offset-distance:100%}}
  @keyframes ax-pulse{50%{opacity:.35}}
  @keyframes ax-blink{50%{opacity:.3}}
  @keyframes ax-rotate-mer{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
  @keyframes ax-sweepr{to{transform:rotate(360deg)}}
  .ax-ticks{animation:ax-spin 80s linear infinite}
  .ax-mer{animation:ax-rotate-mer 18s linear infinite}
  .ax-m2{animation-delay:-1.5s}.ax-m3{animation-delay:-3s}.ax-m4{animation-delay:-4.5s}.ax-m5{animation-delay:-6s}.ax-m6{animation-delay:-7.5s}
  .ax-sweep{animation:ax-sweepr 8s linear infinite}
  .ax-analemma-flow{animation:ax-trace 8s linear infinite;filter:drop-shadow(0 0 3px rgba(212,175,55,.8))}
  .ax-sun{animation:ax-travel 8s linear infinite}
  .ax-sun-halo,.ax-live-dot{animation:ax-pulse 2s ease-in-out infinite}
}
#splash.out{opacity:0;pointer-events:none}
#splash[hidden]{display:none}

/* Hover sólo en dispositivos con puntero preciso */
@media (hover:hover) and (pointer:fine){
  .lift:hover{transform:translateY(-2px);border-color:rgb(var(--glow,var(--line))/.65)}
  .row:hover{background:rgb(var(--surface)/.7)}
  .ticker:hover .ticker-track{animation-play-state:paused}
}

/* Todo el movimiento vive aquí: con "reducir movimiento" no hay animación ni transición */
@media (prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
  .ticker{overflow:hidden}
  .ticker-track{display:flex;width:max-content;animation:marquee 60s linear infinite}
  @keyframes marquee{to{transform:translateX(-50%)}}
  .lift{transition:transform .2s var(--out),border-color .15s ease}
  .row,.navbtn,.pillbtn{transition:background-color .15s ease,color .15s ease,box-shadow .15s ease}
  .press:active{transform:scale(.97);transition:transform .1s ease-out}
  .view{animation:fade .18s ease-out}
  #splash{transition:opacity .7s var(--out)}
  #splash h1,#splash p{animation:rise .8s var(--out) both}
  #splash p{animation-delay:.25s}
  @keyframes fade{from{opacity:0}}
  .dot-live::after{animation:live 1.8s var(--out) infinite}
  @keyframes live{70%,100%{transform:scale(2.6);opacity:0}}
  .drawer{transition:transform .24s var(--out),visibility 0s .24s}
  .drawer.open{transition:transform .3s var(--out),visibility 0s}
  .scrim{transition:opacity .3s var(--out)}
  .drawer-body{animation:fade .18s ease-out}
  /* Única secuencia de entrada: se reproduce una vez al cargar */
  .boot .seg.on{animation:grow .45s var(--out) both;animation-delay:calc(var(--i)*70ms)}
  @keyframes grow{from{transform:scaleX(0)}}
  .boot .lead{animation:rise .45s var(--out) .12s both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
}
</style>

<div id="shell" class="lg:grid lg:grid-cols-[17.5rem_minmax(0,1fr)]">

  <!-- RAÍL: marca, periodo, secciones -->
  <aside id="rail" class="lg:sticky lg:top-0 lg:h-[calc(100vh-2.25rem)] lg:self-start lg:overflow-y-auto border-b lg:border-b-0 lg:border-r border-line/20 bg-surface/60 flex flex-col">

    <footer class="border-t border-line/20 px-4 sm:px-6 lg:px-10 py-5 text-xs text-muted flex flex-col sm:flex-row gap-1 justify-between">
      <span>Contenido generado automáticamente con IA a partir de fuentes públicas. Verifica antes de decidir.</span>
      <span><span id="stamp"></span>. Las cifras son las del briefing, no cotizaciones en vivo.</span>
    </footer>
  </div>
</div>

<!-- DRAWER ANÁLISIS CAUSAL -->
<div id="scrim" data-act="close" class="scrim fixed inset-0 z-40 bg-black/55 backdrop-blur-sm"></div>
<aside id="drawer" class="drawer fixed inset-y-0 right-0 z-50 w-full max-w-2xl bg-bg border-l border-line/25 shadow-2xl flex flex-col" role="dialog" aria-modal="true" aria-labelledby="dTitle" inert>
  <div class="px-5 py-4 border-b border-line/20 glass flex items-start gap-3">
    <div class="flex-1 min-w-0">
      <div id="dMeta" class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-muted mb-2"></div>
      <h2 id="dTitle" class="serif text-2xl md:text-3xl font-medium leading-tight"></h2>
    </div>
    <button data-act="close" id="dClose" class="press w-9 h-9 rounded-md bg-surface2/80 border border-line/20 shrink-0" aria-label="Cerrar análisis"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
  </div>
  <div id="dBody" class="flex-1 overflow-y-auto px-5 pb-6"></div>
  <div class="px-5 py-3 border-t border-line/20 glass flex items-center justify-between text-sm">
    <button data-act="prev" class="press pillbtn px-3 py-2 rounded-md bg-surface2/80 border border-line/20 disabled:opacity-40"><i class="fa-solid fa-chevron-left mr-2 text-xs" aria-hidden="true"></i>Anterior</button>
    <span id="dCount" class="text-muted"></span>
    <button data-act="next" class="press pillbtn px-3 py-2 rounded-md bg-surface2/80 border border-line/20 disabled:opacity-40">Siguiente<i class="fa-solid fa-chevron-right ml-2 text-xs" aria-hidden="true"></i></button>
  </div>
</aside>

<script>
/* =====================================================================
   UI — sólo lee data/db.json
   ===================================================================== */
function boot(DB, IDX) {
  const $ = id => document.getElementById(id);
  const E = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const sc = s => (s = String(s ?? '')) === s.toUpperCase() && !/\S\/\S/.test(s) && s.length > 1 ? s[0] + s.slice(1).toLowerCase() : s;
  const nf = (n, d = 2) => Number(n).toLocaleString('es', { maximumFractionDigits: d });
  const TXT = { crit: 'text-crimson', warn: 'text-amber', ok: 'text-emerald', info: 'text-muted' };
  const BGS = { crit: 'bg-crimson', warn: 'bg-amber', ok: 'bg-emerald', info: 'bg-muted' };
  const BADGE = { crit: 'bg-crimson/12 text-crimson border-crimson/35', warn: 'bg-amber/12 text-amber border-amber/35', ok: 'bg-emerald/12 text-emerald border-emerald/35', info: 'bg-line/10 text-muted border-line/25' };
  const RANK = { crit: 3, warn: 2, ok: 1, info: 0 };
  const badge = (t, tone = 'info') => `<span class="inline-flex items-center rounded-[3px] px-2 py-0.5 text-[11px] font-semibold border whitespace-nowrap ${BADGE[tone]}">${E(sc(t))}</span>`;
  const dot = (tone, live) => `<span class="dot ${BGS[tone]} ${live ? 'dot-live' : ''}"></span>`;
  const empty = m => `<div class="panel p-8 text-center text-muted col-span-full">${m}</div>`;
  const pageHead = (title, sub) => `<header class="max-w-3xl"><h2 class="serif text-4xl md:text-5xl font-medium tracking-tight leading-[1.05]">${title}</h2>${sub ? `<p class="text-muted mt-3 prose-w">${sub}</p>` : ''}</header>`;
  const lvl = n => `<span class="inline-flex gap-0.5 align-middle" role="img" aria-label="Importancia ${n} de 5">${[1, 2, 3, 4, 5].map(i => `<span class="w-3 h-1.5 rounded-[1px] ${i <= n ? 'bg-amber' : 'bg-line/30'}"></span>`).join('')}</span>`;
  const safe = u => /^https?:\/\//i.test(u);
  const srcs = l => { const a = (l || []).filter(s => s && safe(s.url)); return a.length ? `<p class="text-xs text-muted mt-3">Fuentes: ${a.map(s => `<a class="underline hover:text-ink" href="${E(s.url)}" target="_blank" rel="noopener noreferrer">${E(s.title || s.url)}</a>`).join(', ')}</p>` : ''; };
  const fig = (label, value, sub, tone) => `<div class="bg-surface px-4 py-4"><p class="text-xs text-muted">${E(label)}</p><p class="serif text-3xl font-medium leading-none mt-2 ${tone ? TXT[tone] : ''}">${value}</p><p class="text-xs text-muted mt-1.5">${sub ? E(sub) : '&nbsp;'}</p></div>`;

  const TABS = [
    ['exec', 'bolt', 'Resumen ejecutivo'], ['stories', 'newspaper', 'Noticias clave'], ['actors', 'chess-king', 'Matriz geopolítica'],
    ['markets', 'chart-line', 'Macro y mercados'], ['energy', 'gas-pump', 'Energía y chokepoints'], ['intel', 'user-secret', 'Inteligencia y riesgos'],
    ['ai', 'microchip', 'Inteligencia artificial'], ['master', 'graduation-cap', 'Masterclass'], ['archive', 'calendar-days', 'Archivo e informes']
  ];
  const WTABS = [['w-md', 'file-lines', 'Briefing semanal'], ['w-hist', 'calendar-days', 'Histórico semanal']];
  const DTABS = [
    ['d-resumen', 'bolt', 'Resumen del día'], ['d-noticias', 'newspaper', 'Noticias'], ['d-mercados', 'chart-line', 'Mercados'],
    ['d-ia', 'microchip', 'Inteligencia artificial'], ['d-fuentes', 'link', 'Fuentes'], ['d-historico', 'calendar-days', 'Histórico']
  ];
  const HIDE = new Set(['archive', 'd-fuentes', 'w-md']); // siguen existiendo por enlace directo, pero sin pestaña
  const LEVELS = [['week', 'Semana'], ['month', 'Mes'], ['quarter', 'Trim.'], ['year', 'Año']];
  const TFS = [['all', 'Todo'], ['hoy', 'Hoy'], ['3d', '3 días'], ['7d', '7 días']];

  const S = { wk: null, mode: 'inicio', date: null, day: null, err: null, dimp: 'all', dreg: 'all', from: '', to: '', level: 'week', key: null, tab: 'inicio', tf: 'all', q: '', imp: 'all', actor: 'all', risk: 0, list: [], i: 0, opener: null, animCharts: true, hide: { mk: new Set(), hz: new Set() } };

  /* ---------- Modelo temporal ---------- */
  const WEEKS = Object.entries(DB.weeks).map(([k, w]) => ({ k, ...w })).sort((a, b) => b.start.localeCompare(a.start) || b.k.localeCompare(a.k));
  const KEY = {
    week: w => w.k, month: w => w.start.slice(0, 7),
    quarter: w => `${w.start.slice(0, 4)}-Q${Math.ceil(+w.start.slice(5, 7) / 3)}`, year: w => w.start.slice(0, 4)
  };
  function labelOf(level, key, weeks) {
    if (level === 'week') return weeks[0].label;
    if (level === 'month') { const s = new Date(key + '-01T00:00:00Z').toLocaleDateString('es', { month: 'long', year: 'numeric', timeZone: 'UTC' }); return s[0].toUpperCase() + s.slice(1); }
    if (level === 'quarter') return `T${key.slice(-1)} ${key.slice(0, 4)}`;
    return key;
  }
  function periods(level) {
    const m = new Map();
    WEEKS.forEach(w => { const k = KEY[level](w); if (!m.has(k)) m.set(k, []); m.get(k).push(w); });
    return [...m].map(([key, weeks]) => ({ key, weeks, label: labelOf(level, key, weeks) }));
  }
  const uniq = (a, f) => a.filter((x, i) => a.findIndex(y => f(y) === f(x)) === i); // gana la más reciente
  function viewOf() {
    const ps = periods(S.level), p = ps.find(x => x.key === S.key) || ps[0];
    S.key = p.key;
    const cat = f => p.weeks.flatMap(w => w[f] || []);
    const tension = p.weeks.map(w => w.tension).sort((a, b) => RANK[b.tone] - RANK[a.tone])[0];
    return { ...p.weeks[0], stories: uniq(cat('stories'), s => s.title), top10: cat('top10'), risks: uniq(cat('risks'), r => r.risk), hidden: cat('hidden'), ai: uniq(cat('ai'), a => a.title), concepts: uniq(cat('concepts'), c => c.name), tension, period: p };
  }

  /* ---------- Filtros ---------- */
  const hit = o => !S.q || JSON.stringify(o).toLowerCase().includes(S.q.toLowerCase());
  const tfOk = o => S.tf === 'all' || !o.timeframe || o.timeframe === S.tf; // sin horizonte declarado = siempre visible

  /* ---------- Render ---------- */
  function render() {
    const a = document.activeElement, d = a && a.dataset, sel = d && d.act ? `[data-act="${d.act}"]` + (d.v != null ? `[data-v="${CSS.escape(d.v)}"]` : '') : null; // el foco sobrevive al repintado
    if (S.mode === 'inicio') { renderChrome(); renderInicio(); }
    else if (S.mode === 'diario') { renderChrome(); renderDaily(); }
    else if (S.tab.startsWith('w-')) { renderChrome(viewOf()); renderWeekly(); }
    else {
      const v = viewOf();
      renderChrome(v); renderExec(v); renderStories(v); renderActors(v); renderMarkets(v);
      renderEnergy(v); renderIntel(v); renderAI(v); renderMaster(v); renderArchive(v); renderCharts(v);
    }
    if (sel) document.querySelector(sel)?.focus({ preventScroll: true });
  }

  function renderChrome(v) {
    const D = S.mode === 'diario', I = S.mode === 'inicio', W = S.tab.startsWith('w-'), tk = D || I ? dTicker() : v.ticker;
    const items = tk.map(t => { const tone = t.tone || 'info'; return `<span class="inline-flex items-center gap-2 px-5 whitespace-nowrap"><span class="text-muted">${E(t.k)}</span><span class="font-semibold ${t.tone ? TXT[tone] : 'text-ink'}">${E(sc(t.v))}</span>${t.pulse ? dot(tone, true) : ''}</span>`; }).join('');
    $('tickerTrack').innerHTML = items + `<span class="contents" aria-hidden="true">${items}</span>`;
    document.body.dataset.mode = S.mode;
    $('modeBtns').innerHTML = [['inicio', 'Inicio'], ['diario', 'Diario'], ['semanal', 'Semanal']].map(([k, l]) => `<button data-act="mode" data-v="${k}" aria-pressed="${S.mode === k}" class="pillbtn press py-2 rounded ${S.mode === k ? 'bg-ink text-bg font-semibold' : 'text-muted hover:text-ink'}">${l}</button>`).join('');
    $('weekCtl').hidden = D || I || W; $('dayCtl').hidden = !D; $('tfBtns').style.display = D || I || W ? 'none' : ''; // el horizonte sólo tiene sentido en el semanal
    if (D) {
      const i = DATES.indexOf(S.date), arrow = (v, ic, label, off) => `<button data-act="dnav" data-v="${v}" aria-label="${label}" ${off ? 'disabled' : ''} class="press w-9 h-9 shrink-0 rounded-md bg-surface2/80 border border-line/20 disabled:opacity-40"><i class="fa-solid fa-chevron-${ic}" aria-hidden="true"></i></button>`;
      $('dayCtl').innerHTML = `<div class="flex items-center gap-1.5">${arrow('prev', 'left', 'Día anterior', !DATES.length || i === DATES.length - 1)}<input type="date" id="dateSel" aria-label="Día" value="${E(S.date || '')}" ${DATES.length ? `min="${DATES.at(-1)}" max="${DATES[0]}"` : ''} class="flex-1 min-w-0 bg-surface2/80 text-ink border border-line/20 rounded-md px-2 py-2 text-sm">${arrow('next', 'right', 'Día siguiente', i === 0)}</div>`;
    } else {
      $('levelBtns').innerHTML = LEVELS.map(([k, l]) => `<button data-act="level" data-v="${k}" aria-pressed="${S.level === k}" class="pillbtn press py-1.5 rounded ${S.level === k ? 'bg-ink text-bg font-semibold' : 'text-muted hover:text-ink'}">${l}</button>`).join('');
      $('periodSel').innerHTML = periods(S.level).map(p => `<option value="${E(p.key)}" ${p.key === S.key ? 'selected' : ''}>${E(p.label)}</option>`).join('');
      $('tfBtns').innerHTML = TFS.map(([k, l]) => `<button data-act="tf" data-v="${k}" aria-pressed="${S.tf === k}" class="pillbtn press px-3 py-1.5 rounded ${S.tf === k ? 'bg-ink text-bg font-semibold' : 'text-muted hover:text-ink'}">${l}</button>`).join('');
    }
    $('tabs').innerHTML = (I ? [] : D ? DTABS : [...TABS, ...WTABS]).filter(t => !HIDE.has(t[0])).map(([id, ic, l]) => `<button role="tab" id="tab-${id}" data-act="tab" data-v="${id}" aria-selected="${(S.tab === 'w-md' ? 'w-hist' : S.tab) === id}" aria-controls="view-${id}" class="navbtn press shrink-0 rounded-md py-2.5 px-3 flex items-center gap-3 whitespace-nowrap text-left"><i class="fa-solid fa-${ic} w-4 text-center" aria-hidden="true"></i>${l}</button>`).join('');
    [...TABS, ...WTABS, ...DTABS, ['inicio']].forEach(([id]) => { $('view-' + id).hidden = S.tab !== id; });
    $('themeIcon').className = 'fa-solid fa-' + (document.documentElement.dataset.theme === 'light' ? 'moon' : 'sun');
  }

  function renderExec(v) {
    const list = v.top10.filter(i => tfOk(i) && hit(i)), lead = list[0], rest = list.slice(1), bi = v.bigIdea;
    const [big, small] = v.period.label.split(', ');
    const mk = v.charts.markets, hz = v.charts.hormuz, tr = hz.series.find(s => s.key === 'transits'), pr = hz.series.find(s => s.key === 'premium');
    const figs = mk.map(m => fig(m.label, nf(m.value), m.unit)).join('') +
      (tr ? fig('Ormuz, buques al día', nf(tr.data.at(-1), 0), `${nf((tr.data.at(-1) / tr.data[0] - 1) * 100, 0)}% frente a ${hz.labels[0].toLowerCase()}`, 'crit') : '') +
      (pr ? fig('Prima de capitanes', nf(pr.data.at(-1), 0) + '<span class="text-lg">k$</span>', `desde ${nf(pr.data[0], 0)}k$ en ${hz.labels[0].toLowerCase()}`, 'crit') : '');
    const newest = WEEKS[0], endNewest = new Date(Date.parse(newest.start + 'T00:00:00Z') + 6 * 864e5).toISOString().slice(0, 10);
    const feed = S.level === 'week' && S.key === newest.k ? Object.values(DB.days || {}).filter(d => d.date > endNewest && hit(d)).sort((a, b) => b.date.localeCompare(a.date)) : [];
    const feedHtml = feed.length ? `<section aria-label="Última hora"><h3 class="serif text-2xl font-medium">Desde el último briefing</h3><p class="text-sm text-muted mb-4">Noticias diarias; el briefing semanal las consolidará.</p>
      <div>${feed.map(d => `<div class="py-5 border-t border-line/25 grid md:grid-cols-[9rem_minmax(0,1fr)] gap-x-6 gap-y-3"><p class="serif text-xl capitalize">${new Date(d.date + 'T00:00:00Z').toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'short', timeZone: 'UTC' })}</p>
        <div><ul class="space-y-4">${[...d.items].sort((a, b) => b.importance - a.importance).map(i => `<li><div class="flex flex-wrap items-center gap-x-3 gap-y-1"><strong>${E(i.title)}</strong>${lvl(i.importance)}</div><p class="text-sm text-muted leading-relaxed prose-w">${E(i.summary)} <span class="whitespace-nowrap">(${E(i.source)}${i.region ? ', ' + E(i.region) : ''})</span></p></li>`).join('')}</ul>${srcs((d.sources || []).slice(0, 6))}</div></div>`).join('')}</div></section>` : '';
    const RUNGS = [['crit', 'Crítica'], ['warn', 'Elevada'], ['ok', 'Contenida'], ['info', 'Normal']];
    const ladder = `<div role="img" aria-label="Tensión de suministro: ${E(sc(v.tension.label))}, nivel ${RANK[v.tension.tone] + 1} de 4" class="space-y-2.5"><p class="text-sm text-muted">Tensión de suministro</p>${RUNGS.map(([t, l]) => { const on = t === v.tension.tone; return `<div data-lvl="${t}" class="flex items-center gap-4"><span class="seg flex-1 ${on ? 'on' : ''}" style="height:${on ? 16 : 6}px;--i:${3 - RANK[t]}"></span><span class="min-w-[7rem] shrink-0 text-right break-words ${on ? 'serif text-3xl leading-none font-medium ' + TXT[t] : 'text-sm text-muted'}">${on ? E(sc(v.tension.label)) : l}</span></div>`; }).join('')}</div>`;
    const board = (v.chokepoints || []).length ? `<section aria-label="Estado de los nodos críticos"><div class="flex items-baseline justify-between gap-4 mb-2"><h3 class="serif text-xl font-medium">Nodos críticos</h3><button data-act="tab" data-v="energy" class="press text-sm text-muted underline hover:text-ink">Ver energía</button></div><div class="border-t border-line/25">${v.chokepoints.slice(0, 6).map(c => `<div class="row sev flex items-center justify-between gap-3 py-2.5 pl-3 border-b border-line/25" data-lvl="${c.tone}"><span class="flex items-center gap-2.5 min-w-0">${dot(c.tone, c.pulse)}<span class="truncate" title="${E(c.name)}">${E(c.name)}</span></span>${badge(c.status, c.tone)}</div>`).join('')}</div></section>` : '';
    $('view-exec').innerHTML = `
      <header class="grid ${board ? 'lg:grid-cols-[minmax(0,1.15fr)_minmax(0,1fr)]' : ''} gap-8 lg:gap-14 items-end">
        <div class="space-y-8">
          <div><p class="text-sm text-muted mb-2">Briefing del periodo</p>
            <h2 class="serif text-5xl md:text-7xl font-medium tracking-tight leading-[.95]">${E(big)}</h2>
            <p class="text-lg text-muted mt-3">${E(small || (v.period.weeks.length + (v.period.weeks.length > 1 ? ' semanas consolidadas' : ' semana')))}</p></div>
          ${ladder}
        </div>
        ${board}
      </header>
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-px bg-line/20 border border-line/20 rounded-md overflow-hidden" aria-label="Cifras de situación">${figs}</div>
      ${feedHtml}
      ${lead ? `
      <article class="lead glass sev rounded-2xl border border-line/20 p-6 md:p-10 relative overflow-hidden" data-lvl="${lead.level}">
        <div class="absolute inset-0 pointer-events-none" style="background:radial-gradient(40rem 20rem at 100% 0%,rgb(var(--glow)/.16),transparent 70%)"></div>
        <div class="relative">
          <div class="flex items-center gap-3 mb-5">${badge(lead.badge, lead.level)}<span class="text-sm text-muted">Clave ${lead.id} de ${v.top10.length}</span></div>
          <h3 class="serif text-3xl md:text-5xl font-medium leading-[1.05] tracking-tight max-w-[24ch]">${E(lead.title)}</h3>
          <div class="grid md:grid-cols-2 gap-x-10 gap-y-5 mt-8">
            <div><h4 class="text-xs font-semibold text-muted mb-1.5">Qué ha pasado</h4><p class="text-[17px] leading-relaxed">${E(lead.what)}</p></div>
            <div><h4 class="text-xs font-semibold text-muted mb-1.5">Por qué</h4><p class="text-[17px] leading-relaxed">${E(lead.why)}</p></div>
          </div>
          <div class="grid md:grid-cols-2 gap-x-10 gap-y-4 mt-8 pt-6 border-t border-line/20">
            <div><h4 class="text-xs font-semibold text-muted mb-1.5">Consecuencia</h4><p class="leading-relaxed">${E(lead.impact)}</p></div>
            <div><h4 class="text-xs font-semibold ${TXT.warn} mb-1.5">Qué vigilar</h4><p class="leading-relaxed">${E(lead.watch)}</p></div>
          </div>
          ${srcs(lead.sources)}
        </div>
      </article>` : empty('No se encontraron claves con los filtros actuales.')}
      ${rest.length ? `<section aria-label="Resto de claves"><h3 class="serif text-2xl font-medium mb-4">Resto de claves, por impacto estructural</h3>
        <div class="border-t border-line/25">${rest.map(i => `
          <article class="row sev grid md:grid-cols-[3rem_minmax(0,1fr)] gap-x-5 gap-y-2 py-6 pl-4 md:pl-5 pr-2 border-b border-line/25" data-lvl="${i.level}">
            <span class="serif text-3xl text-muted leading-none hidden md:block">${i.id}</span>
            <div class="space-y-3 min-w-0">
              <div class="flex flex-wrap items-center gap-3"><h4 class="serif text-xl md:text-2xl font-medium leading-snug">${E(i.title)}</h4>${badge(i.badge, i.level)}</div>
              <div class="grid lg:grid-cols-3 gap-x-8 gap-y-3 text-sm leading-relaxed">
                <p><strong class="block text-xs text-muted font-semibold mb-0.5">Qué</strong>${E(i.what)}</p>
                <p><strong class="block text-xs text-muted font-semibold mb-0.5">Por qué</strong>${E(i.why)}</p>
                <p><strong class="block text-xs text-muted font-semibold mb-0.5">Quién</strong>${E(i.who)}</p>
              </div>
              <div class="grid lg:grid-cols-2 gap-x-8 gap-y-2 text-sm leading-relaxed">
                <p><strong class="text-muted font-semibold">Consecuencia: </strong>${E(i.impact)}</p>
                <p class="${TXT.warn}"><strong class="font-semibold">Vigilar: </strong>${E(i.watch)}</p>
              </div>
              ${srcs(i.sources)}
            </div>
          </article>`).join('')}</div></section>` : ''}
      <section class="grid lg:grid-cols-2 gap-10 lg:gap-16 pt-4 border-t-2 border-ink/80">
        <div class="pt-6"><p class="text-sm text-muted mb-3">${E(bi.tag)}</p>
          <h3 class="serif text-3xl md:text-4xl font-medium leading-[1.1] mb-4">${E(bi.title)}</h3>
          <p class="text-lg leading-relaxed text-muted prose-w">${E(bi.text)}</p>
          <ul class="mt-6 space-y-4 prose-w">${bi.points.map(p => `<li class="sev pl-4 leading-relaxed" data-lvl="${p.tone}"><strong>${E(p.b)}</strong> <span class="text-muted">${E(p.t)}</span></li>`).join('')}</ul></div>
        <div class="pt-6"><p class="text-sm text-muted mb-3">Hipótesis para la próxima semana</p>
          <div class="space-y-6">${v.hypotheses.map(h => `<div class="sev-t pt-3" data-lvl="${h.tone}"><h4 class="serif text-xl font-medium mb-1">${E(h.t)}</h4><p class="text-muted leading-relaxed">${E(h.d)}</p></div>`).join('')}</div></div>
      </section>`;
  }

  const filteredStories = v => v.stories.filter(s => tfOk(s) && hit(s) && (S.imp === 'all' || s.importance >= +S.imp));
  function renderStories(v) {
    const list = filteredStories(v);
    $('view-stories').innerHTML = pageHead('Análisis causal de las noticias clave', 'Desencadenante, intereses, ganadores y perdedores, impactos y escenarios. Abre una historia para leer el informe y pasa a la siguiente sin volver aquí.') + `
      <label class="inline-flex items-center gap-3 text-sm"><span class="text-muted">Importancia mínima</span>

    $('dMeta').innerHTML = `<span>${E(s.date)}</span><span>${s.countries.map(E).join(', ')}</span>${lvl(s.importance)}`;
    $('dTitle').textContent = s.title;
    $('dCount').textContent = `${S.i + 1} de ${S.list.length}`;
    document.querySelector('[data-act=prev]').disabled = S.i === 0;
    document.querySelector('[data-act=next]').disabled = S.i === S.list.length - 1;
    $('dBody').innerHTML = `<div class="drawer-body">` +
      `<section class="pb-5 pt-4"><h3 class="text-xs font-semibold text-muted mb-1.5">Qué pasó</h3><p class="serif text-xl leading-relaxed">${E(s.what)}</p></section>` +
      sec('Por qué ahora', p(s.why) + `<p class="leading-relaxed mt-2"><strong>Disparador: </strong><span class="text-muted">${E(s.whyNow)}</span></p>`) +
      (s.context ? sec('Contexto y antecedentes', p(s.context)) : '') +
      (s.interests ? sec('Matriz de intereses', p(s.interests)) : '') +
      sec('Ganadores y perdedores', p(s.winnersLosers)) +
      `<div class="grid sm:grid-cols-2 gap-x-8 border-t border-line/20"><section class="py-4"><h3 class="text-xs font-semibold text-muted mb-1.5">Impacto económico</h3>${p(s.econImpact)}</section><section class="py-4"><h3 class="text-xs font-semibold text-muted mb-1.5">Impacto en mercados</h3>${p(s.marketImpact)}</section></div>` +
      (sc_ ? sec('Escenarios prospectivos', `<ul class="space-y-4 mt-3">${scen('Base', sc_.base, 'warn')}${scen('Positivo', sc_.pos, 'ok')}${scen('Negativo', sc_.neg, 'crit')}</ul>`) : '') +
      (s.watch?.length ? sec('Señales a vigilar', `<ul class="list-disc pl-5 space-y-1 leading-relaxed">${s.watch.map(w => `<li>${E(w)}</li>`).join('')}</ul>`) : '') +
      (s.sources?.some(x => safe(x.url)) ? sec('Fuentes', srcs(s.sources).replace('Fuentes: ', '').replace('mt-3', 'mt-0')) : '') +
      (s.concept ? `<p class="text-sm text-muted pt-2 border-t border-line/20">Concepto aplicado: <span class="${TXT.warn} font-semibold">${E(s.concept)}</span></p>` : '') + `</div>`;
    $('dBody').scrollTop = 0;
  }
  function openDrawer(i) {
    S.list = filteredStories(viewOf()); S.i = i; S.opener = document.activeElement;
    fillDrawer();
    dr().inert = false; dr().classList.add('open'); $('scrim').classList.add('on');
    $('dClose').focus();
  }
  function closeDrawer() {
    if (!dr().classList.contains('open')) return;
    dr().classList.remove('open'); dr().inert = true; $('scrim').classList.remove('on');
    S.opener?.focus();
  }
  const step = d => { const n = S.i + d; if (n >= 0 && n < S.list.length) { S.i = n; fillDrawer(); } };

  /* ---------- Modo diario: cada día se dibuja desde data/days/AAAA-MM-DD.json (sin pasar por el Markdown) ---------- */
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const dt = d => new Date(d + 'T00:00:00Z');
  const wday = d => cap(dt(d).toLocaleDateString('es', { weekday: 'long', timeZone: 'UTC' }));
  const ldate = d => dt(d).toLocaleDateString('es', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  const iso0 = () => new Date().toISOString().slice(0, 10);
  const fmtD = d => `${wday(d)}, ${ldate(d)}`;
  // El índice manda; sin content/index.json se usan los días que trae db.json
  const DATES = (IDX.diarios.length ? IDX.diarios.map(x => x.date) : Object.keys(DB.days || {})).sort().reverse();
  const COUNT = Object.fromEntries(IDX.diarios.map(x => [x.date, x.items]));
  const DAYS = {};
  const getDay = d => DAYS[d] ? Promise.resolve(DAYS[d]) : DB.days?.[d] ? Promise.resolve(DAYS[d] = DB.days[d]) : getJSON(`data/days/${d}.json`).then(x => DAYS[d] = x);

  const MK = [['brent', 'Brent', 'USD/barril', 1, '$'], ['wti', 'WTI', 'USD/barril', 1, '$'], ['ttf', 'Gas TTF', 'EUR/MWh', 1, '€'], ['us10y', 'Bono EE. UU. 10 años', '%', 2, '%']];
  const TIERS = [['Crítica', 'crit'], ['Alta', 'warn'], ['Relevante', 'info'], ['Seguimiento', 'info']];
  const tierOf = n => n >= 5 ? 0 : n >= 4 ? 1 : n >= 3 ? 2 : 3;
  const tone = i => TIERS[tierOf(i.importance)][1];
  const byImp = l => [...l].sort((a, b) => b.importance - a.importance); // estable: a igual importancia manda el orden del día

  // shortcut: la serie sale de los días de db.json (los últimos 21); más antiguos no tienen línea ni variación
  function series(key) {
    const pool = { ...(DB.days || {}), [S.date]: S.day };
    return Object.values(pool).filter(d => d && d.date <= S.date && d.markets?.[key] != null).sort((a, b) => a.date.localeCompare(b.date)).slice(-14).map(d => ({ date: d.date, v: d.markets[key] }));
  }
  function spark(pts) {
    if (pts.length < 2) return '';
    const w = 120, h = 32, lo = Math.min(...pts.map(p => p.v)), r = (Math.max(...pts.map(p => p.v)) - lo) || 1;
    const xy = pts.map((p, i) => `${(i / (pts.length - 1) * w).toFixed(1)},${(h - 2 - (p.v - lo) / r * (h - 4)).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="w-full h-8 text-amber mt-3" role="img" aria-label="Evolución en los últimos ${pts.length} días"><polyline points="${xy}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  }
  function delta(key, dec) {
    const s = series(key), n = s.length;
    if (n < 2 || s[n - 1].date !== S.date) return '';
    const d = s[n - 1].v - s[n - 2].v, prev = s[n - 2].date;
    return d === 0 ? 'Sin cambios' : `${d > 0 ? '▲ +' : '▼ −'}${nf(Math.abs(d), dec)} frente al ${prev.slice(8)}/${prev.slice(5, 7)}`;
  }
  const dTicker = () => S.day ? [...MK.map(([k, l, , dec, sy]) => ({ k: l, v: S.day.markets?.[k] != null ? `${nf(S.day.markets[k], dec)} ${sy}` : 'n/d' })), { k: 'Noticias', v: String(S.day.items.length) }] : [{ k: 'Briefing diario', v: 'cargando' }];

  const chip = t => `<span class="inline-flex items-center rounded-[3px] px-2 py-0.5 text-[11px] font-semibold border whitespace-nowrap ${BADGE.info}">${E(t)}</span>`; // sin sc(): conserva siglas como «EE. UU.»
  const newsRow = i => `<article class="row sev py-5 pl-4 pr-2 border-b border-line/25 space-y-2" data-lvl="${tone(i)}"><div class="flex flex-wrap items-center gap-x-3 gap-y-1">${lvl(i.importance)}${i.region ? chip(i.region) : ''}<span class="text-xs text-muted">${E(i.source)}</span></div><h4 class="serif text-xl md:text-2xl font-medium leading-snug">${E(i.title)}</h4><p class="text-muted leading-relaxed prose-w">${E(i.summary)}</p></article>`;
  const aiCard = a => `<article class="sev-t pt-4 space-y-3" data-lvl="info">${a.tag ? chip(a.tag) : ''}<h3 class="serif text-2xl font-medium leading-tight">${E(a.title)}</h3><p class="leading-relaxed">${E(a.summary)}</p>${a.why ? `<p class="text-sm text-muted leading-relaxed"><strong class="${TXT.warn}">Por qué importa:</strong> ${E(a.why)}</p>` : ''}</article>`;

  function dResumen(d) {
    const list = byImp(d.items).filter(hit), lead = list[0], rest = list.slice(1, 6), ai = (d.ai || []).filter(hit);
    const cnt = TIERS.map((_, k) => d.items.filter(i => tierOf(i.importance) === k).length), max = Math.max(1, ...cnt);
    const ladder = `<div class="space-y-2.5" role="img" aria-label="Noticias por importancia: ${TIERS.map(([l], k) => `${cnt[k]} ${l.toLowerCase()}`).join(', ')}"><p class="text-sm text-muted">Noticias por importancia</p>${TIERS.map(([l, t], k) => `<div data-lvl="${t}" class="flex items-center gap-4"><span class="flex-1 h-1.5 rounded-sm bg-line/20"><span class="block h-1.5 rounded-sm" style="width:${cnt[k] / max * 100}%;background:rgb(var(--glow))"></span></span><span class="min-w-[7.5rem] text-right"><span class="serif text-2xl ${cnt[k] ? TXT[t] : 'text-muted'}">${cnt[k]}</span> <span class="text-sm text-muted">${l}</span></span></div>`).join('')}</div>`;
    const figs = MK.map(([k, l, u, dec]) => { const v = d.markets?.[k]; return fig(l, v != null ? nf(v, dec) : '—', v != null ? [u, delta(k, dec)].filter(Boolean).join(' · ') : 'No disponible'); }).join('');
    return `
      <header class="grid lg:grid-cols-[minmax(0,1.15fr)_minmax(0,1fr)] gap-8 lg:gap-14 items-end">
        <div><p class="text-sm text-muted mb-2">Briefing diario · ${E(ldate(d.date))}</p>
          <h2 class="serif text-5xl md:text-7xl font-medium tracking-tight leading-[.95]">${E(wday(d.date))}</h2>
          <p class="text-lg text-muted mt-3">${d.items.length} noticias · ${cnt[0]} ${cnt[0] === 1 ? 'crítica' : 'críticas'} · ${(d.ai || []).length} de IA</p></div>
        ${ladder}
      </header>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-px bg-line/20 border border-line/20 rounded-md overflow-hidden" aria-label="Cierres de mercado">${figs}</div>
      ${lead ? `<article class="lead glass sev rounded-2xl border border-line/20 p-6 md:p-10 relative overflow-hidden" data-lvl="${tone(lead)}">
        <div class="absolute inset-0 pointer-events-none" style="background:radial-gradient(40rem 20rem at 100% 0%,rgb(var(--glow)/.16),transparent 70%)"></div>
        <div class="relative">
          <div class="flex flex-wrap items-center gap-3 mb-5">${badge(TIERS[tierOf(lead.importance)][0], tone(lead))}${lvl(lead.importance)}<span class="text-sm text-muted">Noticia principal del día</span></div>
          <h3 class="serif text-3xl md:text-5xl font-medium leading-[1.05] tracking-tight max-w-[24ch]">${E(lead.title)}</h3>
          <p class="text-[17px] leading-relaxed mt-6 prose-w">${E(lead.summary)}</p>
          <p class="text-sm text-muted mt-5">${[lead.region, lead.source].filter(Boolean).map(E).join(' · ')}</p>
        </div></article>` : empty('Ninguna noticia coincide con la búsqueda.')}
      ${rest.length ? `<section aria-label="Otros titulares"><h3 class="serif text-2xl font-medium mb-4">Otros titulares destacados</h3><div class="border-t border-line/25">${rest.map(newsRow).join('')}</div>${list.length > 6 ? `<button data-act="tab" data-v="d-noticias" class="press mt-4 text-sm underline text-muted hover:text-ink">Ver las ${list.length} noticias del día</button>` : ''}</section>` : ''}
      ${ai.length ? `<section aria-label="Inteligencia artificial" class="pt-4 border-t-2 border-ink/80"><div class="flex items-baseline justify-between gap-4 mb-5"><h3 class="serif text-2xl font-medium">Inteligencia artificial hoy</h3><button data-act="tab" data-v="d-ia" class="press text-sm underline text-muted hover:text-ink">Ver todo</button></div><div class="grid md:grid-cols-2 gap-x-10 gap-y-8">${ai.slice(0, 2).map(aiCard).join('')}</div></section>` : ''}`;
  }

  function dNoticias(d) {
    const regions = ['all', ...new Set(d.items.map(i => i.region).filter(Boolean))];
    if (!regions.includes(S.dreg)) S.dreg = 'all';
    const list = byImp(d.items).filter(i => hit(i) && (S.dimp === 'all' || i.importance >= +S.dimp) && (S.dreg === 'all' || i.region === S.dreg));
    const groups = TIERS.map(([l, t], k) => [l, t, list.filter(i => tierOf(i.importance) === k)]).filter(g => g[2].length);
    return pageHead('Noticias del día', `${E(fmtD(d.date))}. Ordenadas por importancia: ${list.length} de ${d.items.length}.`) + `
      <label class="inline-flex items-center gap-3 text-sm"><span class="text-muted">Importancia mínima</span>
        <select data-act="dimp" class="bg-surface2/80 text-ink border border-line/20 rounded-md px-3 py-2">${[['all', 'Todas'], ['5', 'Solo 5 de 5'], ['4', '4 o más'], ['3', '3 o más']].map(([k, l]) => `<option value="${k}" ${S.dimp === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <div class="flex gap-2 overflow-x-auto pb-1 text-sm" role="group" aria-label="Región">${regions.map(r => `<button data-act="dreg" data-v="${E(r)}" aria-pressed="${S.dreg === r}" class="pillbtn press shrink-0 px-4 py-1.5 rounded-full border ${S.dreg === r ? 'bg-ink text-bg border-ink font-semibold' : 'border-line/30 text-muted hover:text-ink'}">${r === 'all' ? 'Todas' : E(r)}</button>`).join('')}</div>
      ${groups.length ? groups.map(([l, t, items]) => `<section data-lvl="${t}"><h3 class="serif text-2xl font-medium mb-2 flex items-center gap-3">${dot(t)}${l}<span class="text-sm text-muted font-normal">${items.length}</span></h3><div class="border-t border-line/25">${items.map(newsRow).join('')}</div></section>`).join('') : empty('Ninguna noticia coincide con los filtros.')}`;
  }

  function dMercados(d) {
    return pageHead('Mercados', 'Último cierre conocido que figura en las fuentes del día; no son cotizaciones en vivo. La línea recoge los últimos días disponibles.') +
      `<div class="grid sm:grid-cols-2 gap-5">${MK.map(([k, l, u, dec]) => { const v = d.markets?.[k]; return `<div class="panel p-6"><p class="text-sm text-muted">${l}</p><p class="serif text-5xl font-medium leading-none mt-3">${v != null ? nf(v, dec) : '—'}<span class="text-lg text-muted ml-2">${v != null ? u : ''}</span></p><p class="text-sm text-muted mt-2">${v != null ? E(delta(k, dec)) || '&nbsp;' : 'No disponible en las fuentes de este día'}</p>${spark(series(k))}</div>`; }).join('')}</div>`;
  }

  function dIA(d) {
    const ai = (d.ai || []).filter(hit);
    return pageHead('Inteligencia artificial', `${E(fmtD(d.date))}. Modelos, chips, regulación e inversión con impacto económico o geopolítico.`) +
      `<div class="grid md:grid-cols-2 gap-x-10 gap-y-8">${ai.length ? ai.map(aiCard).join('') : empty('Sin noticias de IA para este día o para la búsqueda.')}</div>`;
  }

  function dFuentes(d) {
    const src = (d.sources || []).filter(s => s && safe(s.url));
    return pageHead('Fuentes', `Enlaces consultados para elaborar el briefing del ${E(ldate(d.date))}.`) +
      (src.length ? `<ul class="grid md:grid-cols-2 gap-x-10 gap-y-2 text-sm">${src.map(s => `<li class="truncate"><a class="underline hover:text-ink" href="${E(s.url)}" target="_blank" rel="noopener noreferrer">${E(s.title || s.url)}</a></li>`).join('')}</ul>` : empty('Este día no registra enlaces.')) +
      `<p class="text-sm text-muted">Versión en texto: <a class="underline hover:text-ink" href="content/diarios/${E(d.date)}.md" target="_blank" rel="noopener noreferrer">Markdown</a></p>`;
  }

  function dHistorico() {
    const list = DATES.filter(x => (!S.from || x >= S.from) && (!S.to || x <= S.to));
    return pageHead('Histórico', 'Todos los briefings diarios. Filtra por fechas y abre el que quieras.') + `
      <div class="flex flex-wrap items-end gap-3 text-sm">${[['from', 'Desde'], ['to', 'Hasta']].map(([k, l]) => `<label class="flex flex-col gap-1"><span class="text-muted">${l}</span><input type="date" data-act="date" data-v="${k}" value="${E(S[k])}" class="bg-surface2/80 text-ink border border-line/20 rounded-md px-3 py-2"></label>`).join('')}${S.from || S.to ? '<button data-act="clear" class="press pillbtn px-3 py-2 rounded-md border border-line/30 text-muted hover:text-ink">Quitar filtro</button>' : ''}<span class="text-muted ml-auto">${list.length} de ${DATES.length}</span></div>
      <div class="border-t border-line/25">${list.length ? list.map(x => `<a href="#/diario/${E(x)}" class="row sev flex items-center justify-between gap-4 py-4 pl-4 border-b border-line/25" data-lvl="${x === S.date ? 'warn' : 'info'}"><span class="serif text-xl">${E(fmtD(x))}</span><span class="text-sm text-muted whitespace-nowrap">${COUNT[x] != null ? COUNT[x] + ' noticias' : ''}</span></a>`).join('') : empty('Sin resultados.')}</div>`;
  }

  /* ---------- Modo semanal: los briefings los sube el autor como content/semanales/semana-WW-AAAA.md ---------- */
  const SEM = IDX.semanales || [], WMD = {};
  if (window.DOMPurify) DOMPurify.addHook('afterSanitizeAttributes', n => { if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); } });
  const loadWeek = f => WMD[f] ? Promise.resolve(WMD[f]) : fetch(f, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(t => {
    if (!window.marked || !window.DOMPurify) throw new Error('no se cargó el visor de Markdown');
    return (WMD[f] = DOMPurify.sanitize(marked.parse(t.replace(/^---\n[\s\S]*?\n---\n/, ''))));
  });
  function renderWeekly() {
    if (S.tab === 'w-hist') {
      $('view-w-hist').innerHTML = pageHead('Histórico semanal', 'Todos los briefings semanales subidos.') + (SEM.length
        ? `<div class="border-t border-line/25">${SEM.map(x => `<a href="#/semanal/informe/${E(x.slug)}" class="row sev flex items-center justify-between gap-4 py-4 pl-4 border-b border-line/25" data-lvl="info"><span class="serif text-xl">${E(x.label)}</span><span class="text-sm text-muted text-right">${E(x.title)}</span></a>`).join('')}</div>`
        : empty('Aún no hay semanales subidos.'));
      return;
    }
    const i = Math.max(0, SEM.findIndex(x => x.slug === S.wk)), w = SEM[i], el = $('view-w-md');
    if (!w) { el.innerHTML = pageHead('Briefing semanal', 'Aún no hay ningún semanal subido.') + empty('Sube <code>content/semanales/semana-WW-AAAA.md</code> y aparecerá aquí en un par de minutos. Mientras tanto puedes ver el <a class="underline" href="#/semanal/exec">panel de datos</a>.'); return; }
    const nav = (x, l) => x ? `<a class="underline hover:text-ink" href="#/semanal/informe/${E(x.slug)}">${l}</a>` : '';
    el.innerHTML = pageHead(E(w.label), w.title ? E(w.title) : '') + `<nav class="flex gap-6 text-sm text-muted" aria-label="Semanas">${nav(SEM[i + 1], '← Semana anterior')}${nav(SEM[i - 1], 'Semana siguiente →')}<a class="underline hover:text-ink ml-auto" href="#/semanal/historico">Ver todas</a></nav><article id="wmdBody" class="md max-w-3xl">${empty('Cargando…')}</article>`;
    loadWeek(w.file).then(h => { if (SEM[i] === w && S.tab === 'w-md' && $('wmdBody')) $('wmdBody').innerHTML = h; })
      .catch(e => { if ($('wmdBody')) $('wmdBody').innerHTML = empty(`No se pudo cargar ${E(w.label)} (${E(e.message)}).`); });
  }

  function renderDaily() {
    const d = S.day, R = { 'd-resumen': dResumen, 'd-noticias': dNoticias, 'd-mercados': dMercados, 'd-ia': dIA, 'd-fuentes': dFuentes };
    const msg = !S.date ? empty('Aún no hay diarios: se generan solos cada día. Mientras tanto puedes ver el <a class="underline" href="#/semanal">briefing semanal</a>.')
      : S.err ? empty(`No hay briefing para el ${E(S.date)} (${E(S.err)}). <a class="underline" href="#/diario">Ir al último</a>`)
      : !d ? empty('Cargando el briefing…') : null;
    DTABS.forEach(([id]) => { $('view-' + id).innerHTML = id === 'd-historico' ? dHistorico() : msg || R[id](d); });
  }

  /* ---------- Inicio: lo nuevo desde tu última visita + puerta al semanal ---------- */
  let PREV = null, INI = null;
  try { PREV = localStorage.getItem('intel-seen'); } catch (e) {}
  const shortD = d => dt(d).toLocaleDateString('es', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  function renderInicio() {
    const el = $('view-inicio');
    if (!DATES.length) { el.innerHTML = pageHead('Bienvenido', 'Aún no hay briefings diarios: se generan solos cada día.') + empty('Mientras tanto puedes ver el <a class="underline" href="#/semanal">briefing semanal</a>.'); return; }
    const fresh = !!PREV && PREV < DATES[0];
    if (!INI) {
      el.innerHTML = empty('Cargando las novedades…');
      const want = fresh ? DATES.filter(d => d > PREV).slice(0, 7) : [DATES[0]];
      Promise.all(want.map(getDay)).then(days => {
        INI = { days, fresh }; S.date = DATES[0]; S.day = days[0];
        try { localStorage.setItem('intel-seen', DATES[0]); } catch (e) {}
        if (S.mode === 'inicio') render();
      }).catch(e => { el.innerHTML = empty(`No se pudieron cargar las novedades (${E(e.message)}). <a class="underline" href="#/diario">Ir al último diario</a>`); });
      return;
    }
    const days = INI.days, seen = new Set(), items = byImp(days.flatMap(d => d.items.map(i => ({ ...i, _d: d.date })))).filter(i => !seen.has(i.title) && seen.add(i.title)),
      sai = new Set(), ai = days.flatMap(d => d.ai || []).filter(a => !sai.has(a.title) && sai.add(a.title)),
      list = items, lead = list[0], rest = list.slice(1, 7), crit = items.filter(i => tierOf(i.importance) === 0).length, d0 = days[0];
    const multi = days.length > 1, row = i => newsRow(i).replace('<span class="text-xs text-muted">', `<span class="text-xs text-muted">${multi ? E(shortD(i._d)) + ' · ' : ''}`);
    const sub = INI.fresh ? `${items.length} noticias nuevas en ${days.length} ${days.length === 1 ? 'briefing' : 'briefings'} desde tu última visita (${ldate(PREV)}).` : PREV ? 'No hay novedades desde tu última visita: te dejamos el último briefing.' : 'Este es el último briefing. La próxima vez verás aquí lo que haya cambiado desde que entraste.';
    const figs = MK.map(([k, l, u, dec]) => { const v = d0.markets?.[k]; return fig(l, v != null ? nf(v, dec) : '—', v != null ? [u, delta(k, dec)].filter(Boolean).join(' · ') : 'No disponible'); }).join('');
        el.innerHTML = `
      <header class="max-w-3xl"><p class="text-sm text-muted mb-2">${E(fmtD(d0.date))}</p>
        <h2 class="serif text-5xl md:text-7xl font-medium tracking-tight leading-[.95]">${INI.fresh ? 'Lo que ha cambiado' : 'Bienvenido'}</h2>
        <p class="text-lg text-muted mt-4 prose-w">${E(sub)}${crit ? ` <strong class="${TXT.crit}">${crit} ${crit === 1 ? 'crítica' : 'críticas'}.</strong>` : ''}</p></header>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-px bg-line/20 border border-line/20 rounded-md overflow-hidden" aria-label="Cierres de mercado">${figs}</div>
      ${lead ? `<article class="lead glass sev rounded-2xl border border-line/20 p-6 md:p-10 relative overflow-hidden" data-lvl="${tone(lead)}">
        <div class="absolute inset-0 pointer-events-none" style="background:radial-gradient(40rem 20rem at 100% 0%,rgb(var(--glow)/.16),transparent 70%)"></div>
        <div class="relative"><div class="flex flex-wrap items-center gap-3 mb-5">${badge(TIERS[tierOf(lead.importance)][0], tone(lead))}${lvl(lead.importance)}<span class="text-sm text-muted">${INI.fresh ? 'Nuevo' : 'Noticia principal'}${multi ? ' · ' + E(shortD(lead._d)) : ''}</span></div>
          <h3 class="serif text-3xl md:text-5xl font-medium leading-[1.05] tracking-tight max-w-[24ch]">${E(lead.title)}</h3>
          <p class="text-[17px] leading-relaxed mt-6 prose-w">${E(lead.summary)}</p>
          <p class="text-sm text-muted mt-5">${[lead.region, lead.source].filter(Boolean).map(E).join(' · ')}</p></div></article>` : empty('Ninguna noticia coincide con la búsqueda.')}
      ${rest.length ? `<section aria-label="Otros titulares"><h3 class="serif text-2xl font-medium mb-4">Titulares</h3><div class="border-t border-line/25">${rest.map(row).join('')}</div>${items.length > 7 ? `<a href="#/diario/${E(d0.date)}/noticias" class="press mt-4 inline-block text-sm underline text-muted hover:text-ink">Ver todas las noticias del último día</a>` : ''}</section>` : ''}
      ${ai.length ? `<section aria-label="Inteligencia artificial" class="pt-4 border-t-2 border-ink/80"><h3 class="serif text-2xl font-medium mb-5">Inteligencia artificial</h3><div class="grid md:grid-cols-2 gap-x-10 gap-y-8">${ai.slice(0, 2).map(aiCard).join('')}</div></section>` : ''}
      <section aria-label="Siguiente paso" class="grid md:grid-cols-2 gap-4">
        <a href="#/semanal" class="lift press glass rounded-2xl border border-line/20 p-6 block"><p class="text-sm text-muted mb-2">Siguiente paso</p><h3 class="serif text-3xl font-medium leading-tight">Briefing semanal →</h3><p class="text-muted mt-3">${E(WEEKS[0]?.label || 'Panel de la semana')}</p></a>
        <a href="#/diario/${E(d0.date)}" class="lift press glass rounded-2xl border border-line/20 p-6 block"><p class="text-sm text-muted mb-2">Más detalle</p><h3 class="serif text-3xl font-medium leading-tight">Briefing diario completo →</h3><p class="text-muted mt-3">Noticias, mercados, IA y fuentes de ${E(ldate(d0.date))}</p></a>
      </section>`;
  }

  /* ---------- Rutas por hash: #/ (inicio: novedades), #/diario (último diario), #/diario/AAAA-MM-DD[/pestaña], #/semanal[/pestaña] ---------- */
  function route() {
    const [m, a, b] = location.hash.replace(/^#\/?/, '').split('/');
    S.animCharts = true;
    if (!m || m === 'inicio') {
      S.mode = 'inicio'; S.tab = 'inicio'; S.date = DATES[0] || null; S.day = S.date ? INI?.days[0] || DAYS[S.date] || DB.days?.[S.date] || null : null; render();
    } else if (m === 'semanal') {
      S.mode = 'semanal';
      if (a === 'historico') S.tab = 'w-hist';
      else if (a === 'informe') { S.tab = 'w-md'; S.wk = /^semana-\d{2}-\d{4}$/.test(b || '') ? b : null; }
      else S.tab = TABS.some(x => x[0] === a) ? a : 'exec';
      render();
    }
    else {
      S.mode = 'diario';
      const rest = [a, b].filter(Boolean);
      S.date = /^\d{4}-\d{2}-\d{2}$/.test(rest[0]) ? rest.shift() : DATES[0] || null;
      S.tab = DTABS.find(t => t[0] === 'd-' + rest[0])?.[0] || 'd-resumen';
      S.day = S.date ? DAYS[S.date] || DB.days?.[S.date] || null : null; S.err = null;
      render();
      if (S.date && !S.day) { const want = S.date; getDay(want).then(x => { if (S.date === want) { S.day = x; render(); } }).catch(e => { if (S.date === want) { S.err = e.message; render(); } }); }
    }
    window.scrollTo({ top: 0 });
  }
  const hashFor = id => id === 'inicio' ? '#/' : id.startsWith('d-') ? `#/diario/${S.date || ''}/${id.slice(2)}` : (id === 'w-md' ? '#/semanal/informe' + (S.wk ? '/' + S.wk : '') : id === 'w-hist' ? '#/semanal/historico' : id === 'exec' ? '#/semanal' : '#/semanal/' + id);
  function setTab(id) { const h = hashFor(id); location.hash === h ? route() : (location.hash = h); }
  const goDay = d => { location.hash = `#/diario/${d}/${S.tab.startsWith('d-') ? S.tab.slice(2) : 'resumen'}`; };

  /* ---------- Eventos ---------- */
  const ACT = {
    tab: v => setTab(v),
    level: v => { S.level = v; S.key = null; render(); },
    period: v => { S.key = v; setTab('exec'); },
    goweek: v => { S.level = 'week'; S.key = v; setTab('exec'); },
    tf: v => { S.tf = v; render(); },
    actor: v => { S.actor = v; render(); },
    risk: v => { S.risk = +v; render(); },
    open: v => openDrawer(+v),
    close: closeDrawer, prev: () => step(-1), next: () => step(1),
    clear: () => { S.from = S.to = ''; render(); },
    mode: v => setTab(v === 'inicio' ? 'inicio' : v === 'diario' ? 'd-resumen' : 'exec'),
    dnav: v => { const n = DATES[DATES.indexOf(S.date) + (v === 'prev' ? 1 : -1)]; if (n) goDay(n); },
    dreg: v => { S.dreg = v; render(); },
    theme: () => {
      const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      try { localStorage.setItem('intel-theme', t); } catch (e) {}
      render();
    }
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'chip') { const s = S.hide[b.dataset.g]; s.has(b.dataset.v) ? s.delete(b.dataset.v) : s.add(b.dataset.v); render(); return; }
    ACT[b.dataset.act]?.(b.dataset.v);
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'periodSel') { S.key = e.target.value; render(); }
    if (e.target.dataset.act === 'imp') { S.imp = e.target.value; render(); }
    if (e.target.dataset.act === 'dimp') { S.dimp = e.target.value; render(); }
    if (e.target.id === 'dateSel' && e.target.value) goDay(e.target.value);
    if (e.target.dataset.act === 'date' && ['from', 'to'].includes(e.target.dataset.v)) { S[e.target.dataset.v] = e.target.value; render(); }
  });
  window.addEventListener('hashchange', route);
  $('search').addEventListener('input', e => { S.q = e.target.value.trim(); render(); });
  document.addEventListener('keydown', e => {
    if (!dr().classList.contains('open')) return;
    if (e.key === 'Escape') closeDrawer();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'Tab') { // trampa de foco dentro del drawer
      const f = [...dr().querySelectorAll('button:not([disabled])')], first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  if (DB.updated) $('stamp').textContent = 'Actualizado ' + new Date(DB.updated).toLocaleString('es', { dateStyle: 'medium', timeStyle: 'short' });
  route(); // pinta según el hash (también enlaces directos a un diario)
  // Pantalla de bienvenida: sale cada vez que se abre la web, se funde sola a los 2,6 s (o al tocarla)
  const sp = $('splash');
  $('splashDate').textContent = fmtD(DATES[0] || iso0());
  sp.hidden = false;
  const done = () => { if (sp.hidden) return; sp.classList.add('out'); setTimeout(() => { sp.hidden = true; sp.querySelector('.ax-logo')?.remove(); }, 750); };
  sp.addEventListener('click', done); document.addEventListener('keydown', done, { once: true }); setTimeout(done, 2600);
  setTimeout(() => document.body.classList.remove('boot'), 1200); // la secuencia de entrada sólo corre una vez
}
const getJSON = u => fetch(u, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
// content/index.json es opcional: sin él, el modo diario usa los días que trae db.json
Promise.all([getJSON('data/db.json'), getJSON('content/index.json').catch(() => ({ diarios: [], semanales: [] }))]).then(([db, idx]) => boot(db, idx))
  .catch(e => { document.querySelector('main').innerHTML = `<p class="panel p-8 max-w-2xl">No se pudieron cargar los datos (${String(e.message).replace(/</g, '')}). Si abres el archivo con doble clic, sírvelo con un servidor local (por ejemplo <code>npx serve</code>) o publícalo en GitHub Pages.</p>`; });

</script>
</body>
</html>
