name: Publicar semanal

# El semanal lo subes tú a content/semanales/semana-WW-AAAA.md. Este flujo sólo actualiza el índice para que la web lo muestre. No usa Gemini.
on:
  push:
    paths: ['content/semanales/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intel # el mismo grupo que intel.yml: nunca corren a la vez
  cancel-in-progress: false

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/export-md.mjs
      - name: Guardar índice
        run: git config user.name intel-bot && git config user.email intel-bot@users.noreply.github.com && git add content && (git diff --cached --quiet || (git commit -m "Indice semanal" && git pull --rebase && git push))
